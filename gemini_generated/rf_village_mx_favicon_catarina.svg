<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="favTitle favDesc">
  <title id="favTitle">RF Village MX - Catarina BugCON Favicon</title>
  <desc id="favDesc">Square app icon and favicon featuring the pixel BugCON catarina mascot with green body, BUGCON hoodie, spotted ladybug shell, and RF Village MX label. No skulls, no shields.</desc>
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111D"/>
      <stop offset="50%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#060508"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-brand { font-family: 'Rajdhani', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 800; }
    .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- Favicon Squircle / Rounded Frame -->
  <rect width="512" height="512" rx="96" fill="url(#favBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#1E1B26" stroke-width="4"/>
  <rect x="26" y="26" width="460" height="460" rx="76" fill="none" stroke="#B026FF" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- High-Tech Corner Accent Marks -->
  <path d="M 45 80 L 45 45 L 80 45" fill="none" stroke="#4AF626" stroke-width="5"/>
  <path d="M 467 80 L 467 45 L 432 45" fill="none" stroke="#4AF626" stroke-width="5"/>

  <!-- Main Hero: Pixel Catarina BugCON Mascot -->
  <g id="catarina-hero" transform="translate(136, 42) scale(1.0)">
    <!-- Ladybug Elytra Wings (Vibrant Red #E62D48) -->
    <!-- Left Wing -->
    <path d="M 48 95 H 20 V 120 H 6 V 150 H -4 V 220 H 6 V 250 H 30 V 270 H 55 V 250 H 65 V 120 H 48 Z"
          fill="#E62D48" stroke="#0B0B0D" stroke-width="4"/>
    <!-- Right Wing -->
    <path d="M 192 95 H 220 V 120 H 234 V 150 H 244 V 220 H 234 V 250 H 210 V 270 H 185 V 250 H 175 V 120 H 192 Z"
          fill="#E62D48" stroke="#0B0B0D" stroke-width="4"/>

    <!-- Wing Spots (Black #0B0B0D) -->
    <rect x="10" y="135" width="18" height="20" rx="3" fill="#0B0B0D"/>
    <rect x="32" y="180" width="20" height="24" rx="3" fill="#0B0B0D"/>
    <rect x="8" y="215" width="16" height="18" rx="3" fill="#0B0B0D"/>

    <rect x="212" y="135" width="18" height="20" rx="3" fill="#0B0B0D"/>
    <rect x="188" y="180" width="20" height="24" rx="3" fill="#0B0B0D"/>
    <rect x="216" y="215" width="16" height="18" rx="3" fill="#0B0B0D"/>

    <!-- Feet Claws -->
    <rect x="65" y="265" width="30" height="18" rx="3" fill="#4AF626" stroke="#0B0B0D" stroke-width="3"/>
    <rect x="145" y="265" width="30" height="18" rx="3" fill="#4AF626" stroke="#0B0B0D" stroke-width="3"/>

    <!-- Hoodie (#1E1B26) -->
    <path d="M 48 125 H 192 L 205 160 V 260 H 180 V 272 H 60 V 260 H 35 L 35 160 Z"
          fill="#1E1B26" stroke="#0B0B0D" stroke-width="4"/>
    <path d="M 60 270 H 180 V 278 H 60 Z" fill="#B026FF"/>

    <!-- Hood Drawstrings -->
    <path d="M 75 125 L 120 155 L 165 125" fill="none" stroke="#B026FF" stroke-width="4"/>
    <circle cx="105" cy="180" r="3" fill="#4AF626"/>
    <circle cx="135" cy="180" r="3" fill="#4AF626"/>

    <!-- BUGCON Text on Chest -->
    <g transform="translate(68, 165)">
      <rect x="0" y="0" width="104" height="22" rx="4" fill="#0B0B0D" stroke="#B026FF" stroke-width="1.5"/>
      <text x="10" y="16" fill="#F5F5F7" class="font-mono" font-size="13" font-weight="900" letter-spacing="3">BUGCON</text>
    </g>

    <!-- RF Waves on Chest (NO SKULLS) -->
    <g transform="translate(120, 222)" stroke="#4AF626" fill="none">
      <circle cx="0" cy="5" r="3.5" fill="#4AF626"/>
      <path d="M -12 0 A 13 13 0 0 1 12 0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -20 -6 A 21 21 0 0 1 20 -6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Hands -->
    <rect x="25" y="170" width="18" height="18" rx="2" fill="#4AF626" stroke="#0B0B0D" stroke-width="3"/>
    <rect x="197" y="170" width="18" height="18" rx="2" fill="#4AF626" stroke="#0B0B0D" stroke-width="3"/>

    <!-- Catarina Head (Green Pixel Beetle #4AF626) -->
    <g id="fav-head">
      <path d="M 65 48 H 175 V 58 H 190 V 82 H 198 V 122 H 185 V 135 H 172 V 142 H 68 V 135 H 55 V 122 H 42 V 82 H 50 V 58 H 65 Z"
            fill="#4AF626" stroke="#0B0B0D" stroke-width="4"/>

      <!-- Pixel Antennae -->
      <!-- Left -->
      <path d="M 78 48 V 22 H 65 V 6 H 48 V -6 H 65" fill="none" stroke="#2FA319" stroke-width="8" stroke-linecap="square"/>
      <path d="M 78 48 V 22 H 65 V 6 H 48 V -6 H 65" fill="none" stroke="#4AF626" stroke-width="5" stroke-linecap="square"/>
      <rect x="60" y="-12" width="12" height="12" rx="2" fill="#B026FF" stroke="#0B0B0D" stroke-width="2"/>
      <circle cx="66" cy="-6" r="3" fill="#4AF626" filter="url(#favGlow)"/>

      <!-- Right -->
      <path d="M 162 48 V 22 H 175 V 6 H 192 V -6 H 175" fill="none" stroke="#2FA319" stroke-width="8" stroke-linecap="square"/>
      <path d="M 162 48 V 22 H 175 V 6 H 192 V -6 H 175" fill="none" stroke="#4AF626" stroke-width="5" stroke-linecap="square"/>
      <rect x="168" y="-12" width="12" height="12" rx="2" fill="#B026FF" stroke="#0B0B0D" stroke-width="2"/>
      <circle cx="174" cy="-6" r="3" fill="#4AF626" filter="url(#favGlow)"/>

      <!-- Antenna signal rings -->
      <path d="M 48 -10 Q 66 -22 84 -10" fill="none" stroke="#4AF626" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 156 -10 Q 174 -22 192 -10" fill="none" stroke="#4AF626" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Hacker Eyes / Visor -->
      <rect x="70" y="80" width="28" height="32" rx="4" fill="#0B0B0D"/>
      <rect x="74" y="84" width="12" height="14" rx="2" fill="#FFFFFF"/>
      <rect x="76" y="102" width="18" height="6" fill="#4AF626"/>

      <rect x="142" y="80" width="28" height="32" rx="4" fill="#0B0B0D"/>
      <rect x="146" y="84" width="12" height="14" rx="2" fill="#FFFFFF"/>
      <rect x="148" y="102" width="18" height="6" fill="#4AF626"/>

      <!-- Smile -->
      <path d="M 108 122 H 118 V 128 H 128 V 128 H 138 V 122" fill="none" stroke="#0B0B0D" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Bottom Branding Banner: RF VILLAGE MX -->
  <g transform="translate(66, 385)">
    <rect x="0" y="0" width="380" height="74" rx="14" fill="#16141C" stroke="#B026FF" stroke-width="2.5"/>
    <line x1="20" y1="62" x2="360" y2="62" stroke="#E62D48" stroke-width="3"/>
    
    <text x="35" y="44" class="font-brand" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      RF VILLAGE <tspan fill="#4AF626" filter="url(#favGlow)">MX</tspan>
    </text>
  </g>
</svg>
